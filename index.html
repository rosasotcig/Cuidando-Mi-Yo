<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meal Prep — Cuidando Mi Yo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#EFEAE0; min-height:100vh; }
  #root { min-height:100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;


/* ---------- helpers ---------- */

const uid = () => Math.random().toString(36).slice(2, 10);

const DAYS = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];
const DAY_FULL = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];
const MEALS = [
  { key: "desayuno", label: "Desayuno" },
  { key: "comida", label: "Comida" },
  { key: "cena", label: "Cena" },
  { key: "snack", label: "Snack" },
];
const STYLES = ["Sin restricciones", "Keto", "Mediterráneo", "Vegetariano", "Vegano", "Personalizado"];
const MOVEMENT_OPTIONS = ["Gym", "Caminata", "Meditación", "Descanso", "Otro"];

function mondayOf(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = d.getDate() - (day === 0 ? 6 : day - 1);
  d.setDate(diff);
  d.setHours(0, 0, 0, 0);
  return d;
}
function fmtDate(d) {
  return d.toLocaleDateString("es-MX", { day: "2-digit", month: "short" });
}
function isoDate(d) {
  return d.toISOString().slice(0, 10);
}
function weekKey(monday) {
  const d = new Date(monday);
  const onejan = new Date(d.getFullYear(), 0, 1);
  const week = Math.ceil(((d - onejan) / 86400000 + onejan.getDay() + 1) / 7);
  return `${d.getFullYear()}-W${String(week).padStart(2, "0")}`;
}
function addDays(d, n) {
  const nd = new Date(d);
  nd.setDate(nd.getDate() + n);
  return nd;
}
function download(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

const DEFAULT_STATE = {
  profile: {
    style: "Sin restricciones",
    fastingTarget: 16,
    targetWeightMine: "",
    targetWeightAldo: "",
    monthlyBudget: "",
  },
  weights: { mine: [], aldo: [] },
  supplements: [],
  fasting: { activeSince: null, history: [] },
  movement: [],
  mealPlan: {},
  recipes: [],
  shopping: [],
  expenses: [],
};

/* ---------- storage hook ---------- */

const JSONBIN_BIN_ID = "6a7b8a4bf5f4af5e29090e64";
const JSONBIN_API_KEY = "$2a$10$81bTH0y5JuRIJJLuY1NEtOxDyQBhds60n.bdsRmII8isneyD/LBBK";
const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;

function useAppData() {
  const [data, setData] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [syncing, setSyncing] = useState(false);
  const saveTimer = useRef(null);

  useEffect(() => {
    (async () => {
      try {
        const res = await fetch(`${JSONBIN_URL}/latest`, {
          headers: { "X-Master-Key": JSONBIN_API_KEY },
        });
        const json = await res.json();
        setData({ ...DEFAULT_STATE, ...json.record });
      } catch {
        setData(DEFAULT_STATE);
      }
      setLoaded(true);
    })();
  }, []);

  const update = useCallback((updater) => {
    setData((prev) => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      if (saveTimer.current) clearTimeout(saveTimer.current);
      saveTimer.current = setTimeout(async () => {
        setSyncing(true);
        try {
          await fetch(JSONBIN_URL, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              "X-Master-Key": JSONBIN_API_KEY,
            },
            body: JSON.stringify(next),
          });
        } catch {
          // si falla el guardado, se reintenta en el siguiente cambio
        }
        setSyncing(false);
      }, 500);
      return next;
    });
  }, []);

  return { data, update, loaded, syncing };
}

/* ---------- shared UI bits ---------- */

function Card({ title, eyebrow, children, right }) {
  return (
    <div className="card">
      {(title || eyebrow) && (
        <div className="card-head">
          <div>
            {eyebrow && <div className="eyebrow">{eyebrow}</div>}
            {title && <h3>{title}</h3>}
          </div>
          {right}
        </div>
      )}
      {children}
    </div>
  );
}

function Chip({ active, onClick, children }) {
  return (
    <button className={`chip ${active ? "chip-active" : ""}`} onClick={onClick} type="button">
      {children}
    </button>
  );
}

function Field({ label, children }) {
  return (
    <label className="field">
      <span>{label}</span>
      {children}
    </label>
  );
}

/* ---------- Inicio ---------- */

function Inicio({ data, goTo }) {
  const todayIdx = (new Date().getDay() + 6) % 7;
  const wk = weekKey(mondayOf(new Date()));
  const plan = data.mealPlan[wk] || {};
  const todayPlan = plan[todayIdx] || {};

  const lastMine = data.weights.mine[data.weights.mine.length - 1];
  const prevMine = data.weights.mine[data.weights.mine.length - 2];
  const lastAldo = data.weights.aldo[data.weights.aldo.length - 1];
  const prevAldo = data.weights.aldo[data.weights.aldo.length - 2];

  const pendingItems = data.shopping.filter((i) => !i.checked).length;
  const thisMonth = new Date().toISOString().slice(0, 7);
  const monthSpend = data.expenses
    .filter((e) => e.date.startsWith(thisMonth))
    .reduce((s, e) => s + Number(e.amount || 0), 0);

  const bookmarked = data.recipes.filter((r) => r.bookmarked).length;

  const fastingElapsed = data.fasting.activeSince
    ? Math.floor((Date.now() - new Date(data.fasting.activeSince).getTime()) / 60000)
    : null;

  function delta(last, prev) {
    if (!last || !prev) return null;
    const d = last.kg - prev.kg;
    return d;
  }

  return (
    <div className="grid-2">
      <Card eyebrow="Hoy" title={DAY_FULL[todayIdx]} right={<button className="link" onClick={() => goTo("plan")}>Ver semana →</button>}>
        <ul className="meal-recap">
          {MEALS.map((m) => (
            <li key={m.key}>
              <span className="meal-tag">{m.label}</span>
              <span>{todayPlan[m.key] || <em className="muted">sin planear</em>}</span>
            </li>
          ))}
        </ul>
      </Card>

      <Card eyebrow="Ayuno" title={data.fasting.activeSince ? "En curso" : "Sin sesión activa"} right={<button className="link" onClick={() => goTo("cuerpo")}>Cuerpo →</button>}>
        {data.fasting.activeSince ? (
          <p className="big-stat">
            {Math.floor(fastingElapsed / 60)}h {fastingElapsed % 60}m
            <span className="muted"> / meta {data.profile.fastingTarget}h</span>
          </p>
        ) : (
          <p className="muted">Meta actual: {data.profile.fastingTarget} horas</p>
        )}
      </Card>

      <Card eyebrow="Peso" title="Últimos registros" right={<button className="link" onClick={() => goTo("cuerpo")}>Ver tabla →</button>}>
        <div className="weight-recap">
          <div>
            <span className="muted">Tú</span>
            <p className="big-stat">
              {lastMine ? `${lastMine.kg} kg` : "—"}
              {delta(lastMine, prevMine) != null && (
                <span className={`delta ${delta(lastMine, prevMine) < 0 ? "down" : "up"}`}>
                  {delta(lastMine, prevMine) > 0 ? "+" : ""}
                  {delta(lastMine, prevMine).toFixed(1)}
                </span>
              )}
            </p>
          </div>
          <div>
            <span className="muted">Aldo</span>
            <p className="big-stat">
              {lastAldo ? `${lastAldo.kg} kg` : "—"}
              {delta(lastAldo, prevAldo) != null && (
                <span className={`delta ${delta(lastAldo, prevAldo) < 0 ? "down" : "up"}`}>
                  {delta(lastAldo, prevAldo) > 0 ? "+" : ""}
                  {delta(lastAldo, prevAldo).toFixed(1)}
                </span>
              )}
            </p>
          </div>
        </div>
      </Card>

      <Card eyebrow="Súper" title={`${pendingItems} pendientes`} right={<button className="link" onClick={() => goTo("super")}>Ir a súper →</button>}>
        <p className="big-stat">
          ${monthSpend.toFixed(0)}
          <span className="muted"> gastado este mes</span>
        </p>
        {data.profile.monthlyBudget && (
          <p className="muted small">
            Presupuesto: ${data.profile.monthlyBudget} · {monthSpend <= data.profile.monthlyBudget ? "vas bien" : "te pasaste"}
          </p>
        )}
      </Card>

      <Card eyebrow="Recetario" title={`${bookmarked} guardadas`} right={<button className="link" onClick={() => goTo("recetario")}>Explorar →</button>}>
        <p className="muted">{data.recipes.length} recetas en total · estilo actual: {data.profile.style}</p>
      </Card>

      <Card eyebrow="Movimiento y descanso" title="Esta semana" right={<button className="link" onClick={() => goTo("cuerpo")}>Ver diario →</button>}>
        {(() => {
          const monday = mondayOf(new Date());
          const weekEntries = data.movement.filter((m) => {
            const d = new Date(m.date);
            return d >= monday && d <= addDays(monday, 6);
          });
          const movedDays = new Set(weekEntries.filter((m) => m.activities.some((a) => a !== "Descanso")).map((m) => m.date)).size;
          const restDays = new Set(weekEntries.filter((m) => m.activities.includes("Descanso")).map((m) => m.date)).size;
          if (weekEntries.length === 0) return <p className="muted">Sin entradas esta semana — está bien, no es obligatorio.</p>;
          return (
            <p className="big-stat">
              {movedDays} <span className="muted" style={{ fontFamily: "'IBM Plex Sans', sans-serif" }}>días activos</span>
              {" · "}
              {restDays} <span className="muted" style={{ fontFamily: "'IBM Plex Sans', sans-serif" }}>de descanso</span>
            </p>
          );
        })()}
      </Card>
    </div>
  );
}

/* ---------- Cuerpo ---------- */

function Cuerpo({ data, update }) {
  const [person, setPerson] = useState("mine");
  const [kg, setKg] = useState("");
  const [supName, setSupName] = useState("");
  const [supDose, setSupDose] = useState("");
  const [supPerson, setSupPerson] = useState("mine");
  const [moveDate, setMoveDate] = useState(isoDate(new Date()));
  const [moveActs, setMoveActs] = useState([]);
  const [moveMinutes, setMoveMinutes] = useState("");
  const [moveNote, setMoveNote] = useState("");

  function addWeight() {
    if (!kg) return;
    update((d) => ({
      ...d,
      weights: {
        ...d.weights,
        [person]: [...d.weights[person], { id: uid(), date: isoDate(new Date()), kg: Number(kg) }],
      },
    }));
    setKg("");
  }

  function toggleFasting() {
    update((d) => {
      if (d.fasting.activeSince) {
        const start = new Date(d.fasting.activeSince);
        const hours = (Date.now() - start.getTime()) / 3600000;
        return {
          ...d,
          fasting: {
            activeSince: null,
            history: [...d.fasting.history, { id: uid(), date: isoDate(new Date()), hours: Number(hours.toFixed(1)) }],
          },
        };
      }
      return { ...d, fasting: { ...d.fasting, activeSince: new Date().toISOString() } };
    });
  }

  function addSupplement() {
    if (!supName) return;
    update((d) => ({
      ...d,
      supplements: [...d.supplements, { id: uid(), name: supName, dose: supDose, person: supPerson }],
    }));
    setSupName("");
    setSupDose("");
  }

  function removeSupplement(id) {
    update((d) => ({ ...d, supplements: d.supplements.filter((s) => s.id !== id) }));
  }

  function toggleMoveAct(act) {
    setMoveActs((prev) => (prev.includes(act) ? prev.filter((a) => a !== act) : [...prev, act]));
  }

  function addMovement() {
    if (moveActs.length === 0 && !moveNote) return;
    update((d) => ({
      ...d,
      movement: [...d.movement, { id: uid(), date: moveDate, activities: moveActs, minutes: moveMinutes, note: moveNote }],
    }));
    setMoveActs([]);
    setMoveMinutes("");
    setMoveNote("");
  }

  function removeMovement(id) {
    update((d) => ({ ...d, movement: d.movement.filter((m) => m.id !== id) }));
  }

  function exportWeightsCSV() {
    const rows = [["persona", "fecha", "kg"]];
    data.weights.mine.forEach((w) => rows.push(["Tú", w.date, w.kg]));
    data.weights.aldo.forEach((w) => rows.push(["Aldo", w.date, w.kg]));
    const csv = rows.map((r) => r.join(",")).join("\n");
    download("peso.csv", csv, "text/csv");
  }

  const allWeights = [
    ...data.weights.mine.map((w) => ({ ...w, person: "Tú" })),
    ...data.weights.aldo.map((w) => ({ ...w, person: "Aldo" })),
  ].sort((a, b) => (a.date < b.date ? 1 : -1));

  return (
    <div className="stack">
      <Card eyebrow="Estilo de alimentación" title="¿Cómo estamos comiendo?">
        <div className="chips">
          {STYLES.map((s) => (
            <Chip key={s} active={data.profile.style === s} onClick={() => update((d) => ({ ...d, profile: { ...d.profile, style: s } }))}>
              {s}
            </Chip>
          ))}
        </div>
      </Card>

      <div className="grid-2">
        <Card eyebrow="Peso" title="Registrar">
          <div className="row">
            <select value={person} onChange={(e) => setPerson(e.target.value)}>
              <option value="mine">Tú</option>
              <option value="aldo">Aldo</option>
            </select>
            <input type="number" step="0.1" placeholder="kg" value={kg} onChange={(e) => setKg(e.target.value)} />
            <button className="btn" onClick={addWeight}>Agregar</button>
          </div>
          <div className="row" style={{ marginTop: 12 }}>
            <Field label="Meta tuya (opcional)">
              <input
                type="number"
                placeholder="kg"
                value={data.profile.targetWeightMine}
                onChange={(e) => update((d) => ({ ...d, profile: { ...d.profile, targetWeightMine: e.target.value } }))}
              />
            </Field>
            <Field label="Meta de Aldo (opcional)">
              <input
                type="number"
                placeholder="kg"
                value={data.profile.targetWeightAldo}
                onChange={(e) => update((d) => ({ ...d, profile: { ...d.profile, targetWeightAldo: e.target.value } }))}
              />
            </Field>
          </div>
          <p className="muted small" style={{ marginTop: 8 }}>
            Esto es solo referencia, no una meta que perseguir con presión — es tu manera de ver el progreso del esfuerzo.
          </p>
        </Card>

        <Card eyebrow="Ayuno intermitente" title="Tracking de horas">
          <Field label="Meta de horas">
            <input
              type="number"
              value={data.profile.fastingTarget}
              onChange={(e) => update((d) => ({ ...d, profile: { ...d.profile, fastingTarget: Number(e.target.value) } }))}
            />
          </Field>
          <button className={`btn ${data.fasting.activeSince ? "btn-stop" : ""}`} style={{ marginTop: 10 }} onClick={toggleFasting}>
            {data.fasting.activeSince ? "Terminar ayuno" : "Empezar ayuno"}
          </button>
          {data.fasting.history.length > 0 && (
            <ul className="mini-list">
              {data.fasting.history.slice(-4).reverse().map((h) => (
                <li key={h.id}>
                  <span>{h.date}</span>
                  <span>{h.hours}h</span>
                </li>
              ))}
            </ul>
          )}
        </Card>
      </div>

      <Card eyebrow="Suplementos y medicamentos" title="Lo que estamos tomando">
        <div className="row">
          <select value={supPerson} onChange={(e) => setSupPerson(e.target.value)}>
            <option value="mine">Tú</option>
            <option value="aldo">Aldo</option>
          </select>
          <input placeholder="nombre" value={supName} onChange={(e) => setSupName(e.target.value)} />
          <input placeholder="dosis / frecuencia" value={supDose} onChange={(e) => setSupDose(e.target.value)} />
          <button className="btn" onClick={addSupplement}>Agregar</button>
        </div>
        <ul className="mini-list" style={{ marginTop: 12 }}>
          {data.supplements.map((s) => (
            <li key={s.id}>
              <span><strong>{s.person === "mine" ? "Tú" : "Aldo"}</strong> — {s.name} {s.dose && `· ${s.dose}`}</span>
              <button className="icon-btn" onClick={() => removeSupplement(s.id)}>✕</button>
            </li>
          ))}
          {data.supplements.length === 0 && <p className="muted">Nada registrado todavía.</p>}
        </ul>
      </Card>

      <Card eyebrow="Movimiento y descanso" title="¿Qué hizo tu cuerpo hoy?">
        <div className="row" style={{ marginBottom: 8 }}>
          <input type="date" value={moveDate} onChange={(e) => setMoveDate(e.target.value)} />
          <input
            type="number"
            placeholder="min. (opcional)"
            value={moveMinutes}
            onChange={(e) => setMoveMinutes(e.target.value)}
            style={{ maxWidth: 130 }}
          />
        </div>
        <div className="chips">
          {MOVEMENT_OPTIONS.map((act) => (
            <Chip key={act} active={moveActs.includes(act)} onClick={() => toggleMoveAct(act)}>
              {act}
            </Chip>
          ))}
        </div>
        <textarea
          placeholder="¿Cómo se sintió tu cuerpo hoy? (reflexión libre, opcional)"
          value={moveNote}
          onChange={(e) => setMoveNote(e.target.value)}
          style={{ marginTop: 10, minHeight: 64 }}
        />
        <button className="btn" style={{ marginTop: 10 }} onClick={addMovement}>Guardar entrada</button>

        <ul className="mini-list" style={{ marginTop: 14 }}>
          {data.movement.slice(-6).reverse().map((m) => (
            <li key={m.id} style={{ alignItems: "flex-start" }}>
              <span>
                <strong>{m.date}</strong>
                {m.activities.length > 0 && <> — {m.activities.join(", ")}{m.minutes && ` · ${m.minutes} min`}</>}
                {m.note && <div className="muted small" style={{ marginTop: 2, fontStyle: "italic" }}>“{m.note}”</div>}
              </span>
              <button className="icon-btn" onClick={() => removeMovement(m.id)}>✕</button>
            </li>
          ))}
          {data.movement.length === 0 && <p className="muted">Nada registrado todavía — no tiene que ser todos los días.</p>}
        </ul>
      </Card>

      <Card eyebrow="Historial" title="Tabla de peso" right={<button className="link" onClick={exportWeightsCSV}>Exportar CSV →</button>}>
        <table className="table">
          <thead>
            <tr><th>Persona</th><th>Fecha</th><th>kg</th></tr>
          </thead>
          <tbody>
            {allWeights.slice(0, 12).map((w) => (
              <tr key={w.id}><td>{w.person}</td><td>{w.date}</td><td>{w.kg}</td></tr>
            ))}
            {allWeights.length === 0 && <tr><td colSpan={3} className="muted">Sin registros aún.</td></tr>}
          </tbody>
        </table>
      </Card>
    </div>
  );
}

/* ---------- Plan (calendario semanal) ---------- */

function Plan({ data, update }) {
  const [offset, setOffset] = useState(0);
  const monday = mondayOf(addDays(new Date(), offset * 7));
  const wk = weekKey(monday);
  const plan = data.mealPlan[wk] || {};

  function setMeal(dayIdx, mealKey, value) {
    update((d) => {
      const dayPlan = { ...(d.mealPlan[wk]?.[dayIdx] || {}), [mealKey]: value };
      return {
        ...d,
        mealPlan: { ...d.mealPlan, [wk]: { ...(d.mealPlan[wk] || {}), [dayIdx]: dayPlan } },
      };
    });
  }

  function exportPDF() {
    const win = window.open("", "_blank");
    const rows = DAYS.map((day, i) => {
      const dp = plan[i] || {};
      return `<tr><td><strong>${day} ${fmtDate(addDays(monday, i))}</strong></td>${MEALS.map((m) => `<td>${dp[m.key] || "—"}</td>`).join("")}</tr>`;
    }).join("");
    win.document.write(`
      <html><head><title>Plan de comida</title>
      <style>
        body{font-family:sans-serif;padding:24px;color:#2B2A26}
        table{width:100%;border-collapse:collapse}
        th,td{border:1px solid #ddd;padding:8px;text-align:left;font-size:13px}
        th{background:#EFEAE0}
      </style></head><body>
      <h2>Plan de comida — semana del ${fmtDate(monday)}</h2>
      <table><thead><tr><th>Día</th>${MEALS.map((m) => `<th>${m.label}</th>`).join("")}</tr></thead>
      <tbody>${rows}</tbody></table>
      </body></html>
    `);
    win.document.close();
    win.print();
  }

  function exportICS() {
    let ics = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//meal-prep//ES\n";
    DAYS.forEach((_, i) => {
      const day = addDays(monday, i);
      MEALS.forEach((m) => {
        const text = plan[i]?.[m.key];
        if (!text) return;
        const dt = isoDate(day).replace(/-/g, "");
        ics += `BEGIN:VEVENT\nUID:${uid()}@mealprep\nDTSTART;VALUE=DATE:${dt}\nSUMMARY:${m.label}: ${text}\nEND:VEVENT\n`;
      });
    });
    ics += "END:VCALENDAR";
    download(`plan-semana-${wk}.ics`, ics, "text/calendar");
  }

  return (
    <div className="stack">
      <Card
        eyebrow="Calendario semanal"
        title={`Semana del ${fmtDate(monday)} al ${fmtDate(addDays(monday, 6))}`}
        right={
          <div className="row">
            <button className="icon-btn" onClick={() => setOffset(offset - 1)}>←</button>
            <button className="icon-btn" onClick={() => setOffset(0)}>Hoy</button>
            <button className="icon-btn" onClick={() => setOffset(offset + 1)}>→</button>
          </div>
        }
      >
        <div className="plan-toolbar">
          <button className="link" onClick={exportPDF}>Exportar a PDF →</button>
          <button className="link" onClick={exportICS}>Descargar .ics (iPhone) →</button>
        </div>
        <div className="plan-grid">
          {DAYS.map((day, i) => (
            <div key={day} className="plan-day">
              <div className="plan-day-head">{day} <span className="muted">{fmtDate(addDays(monday, i))}</span></div>
              {MEALS.map((m) => (
                <textarea
                  key={m.key}
                  placeholder={m.label}
                  value={plan[i]?.[m.key] || ""}
                  onChange={(e) => setMeal(i, m.key, e.target.value)}
                />
              ))}
            </div>
          ))}
        </div>
      </Card>
      <p className="muted small">
        El .ics lo puedes abrir en iPhone y añadirlo a tu calendario, o suscribirte a él si lo subes a algún hosting — Claude no puede escribir directo en tu Calendar desde aquí.
      </p>
    </div>
  );
}

/* ---------- Recetario ---------- */

function Recetario({ data, update }) {
  const [query, setQuery] = useState("");
  const [tagFilter, setTagFilter] = useState("Todas");
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ name: "", tag: "Sin restricciones", ingredients: "", steps: "" });

  function addRecipe() {
    if (!form.name) return;
    update((d) => ({
      ...d,
      recipes: [...d.recipes, { id: uid(), ...form, bookmarked: false, mine: true }],
    }));
    setForm({ name: "", tag: "Sin restricciones", ingredients: "", steps: "" });
    setShowForm(false);
  }

  function toggleBookmark(id) {
    update((d) => ({ ...d, recipes: d.recipes.map((r) => (r.id === id ? { ...r, bookmarked: !r.bookmarked } : r)) }));
  }

  function removeRecipe(id) {
    update((d) => ({ ...d, recipes: d.recipes.filter((r) => r.id !== id) }));
  }

  const filtered = data.recipes.filter((r) => {
    const matchesQuery = r.name.toLowerCase().includes(query.toLowerCase());
    const matchesTag = tagFilter === "Todas" || r.tag === tagFilter;
    return matchesQuery && matchesTag;
  });

  return (
    <div className="stack">
      <Card eyebrow="Recetario" title="Tus recetas" right={<button className="btn" onClick={() => setShowForm(!showForm)}>{showForm ? "Cancelar" : "+ Nueva receta"}</button>}>
        <div className="row">
          <input placeholder="Buscar receta…" value={query} onChange={(e) => setQuery(e.target.value)} />
          <select value={tagFilter} onChange={(e) => setTagFilter(e.target.value)}>
            <option>Todas</option>
            {STYLES.map((s) => <option key={s}>{s}</option>)}
          </select>
        </div>

        {showForm && (
          <div className="recipe-form">
            <input placeholder="Nombre de la receta" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />
            <select value={form.tag} onChange={(e) => setForm({ ...form, tag: e.target.value })}>
              {STYLES.map((s) => <option key={s}>{s}</option>)}
            </select>
            <textarea placeholder="Ingredientes (uno por línea)" value={form.ingredients} onChange={(e) => setForm({ ...form, ingredients: e.target.value })} />
            <textarea placeholder="Pasos" value={form.steps} onChange={(e) => setForm({ ...form, steps: e.target.value })} />
            <button className="btn" onClick={addRecipe}>Guardar receta</button>
          </div>
        )}
      </Card>

      <div className="recipe-grid">
        {filtered.map((r) => (
          <Card key={r.id} eyebrow={r.tag} title={r.name} right={
            <button className="icon-btn" onClick={() => toggleBookmark(r.id)} title="Guardar">
              {r.bookmarked ? "★" : "☆"}
            </button>
          }>
            {r.ingredients && <p className="muted small"><strong>Ingredientes:</strong> {r.ingredients}</p>}
            {r.steps && <p className="muted small"><strong>Pasos:</strong> {r.steps}</p>}
            <button className="link" onClick={() => removeRecipe(r.id)}>Eliminar</button>
          </Card>
        ))}
        {filtered.length === 0 && <p className="muted">No hay recetas todavía — agrega la primera arriba.</p>}
      </div>
    </div>
  );
}

/* ---------- Súper ---------- */

function Super({ data, update }) {
  const [item, setItem] = useState("");
  const [qty, setQty] = useState("");
  const [unit, setUnit] = useState("");
  const [expDate, setExpDate] = useState(isoDate(new Date()));
  const [expAmount, setExpAmount] = useState("");
  const [expNote, setExpNote] = useState("");

  function addItem() {
    if (!item) return;
    update((d) => ({ ...d, shopping: [...d.shopping, { id: uid(), name: item, qty, unit, checked: false }] }));
    setItem(""); setQty(""); setUnit("");
  }
  function toggleItem(id) {
    update((d) => ({ ...d, shopping: d.shopping.map((i) => (i.id === id ? { ...i, checked: !i.checked } : i)) }));
  }
  function removeItem(id) {
    update((d) => ({ ...d, shopping: d.shopping.filter((i) => i.id !== id) }));
  }
  function addExpense() {
    if (!expAmount) return;
    update((d) => ({ ...d, expenses: [...d.expenses, { id: uid(), date: expDate, amount: Number(expAmount), note: expNote }] }));
    setExpAmount(""); setExpNote("");
  }
  function removeExpense(id) {
    update((d) => ({ ...d, expenses: d.expenses.filter((e) => e.id !== id) }));
  }
  function exportListPDF() {
    const win = window.open("", "_blank");
    const rows = data.shopping.map((i) => `<tr><td>${i.checked ? "✓" : ""}</td><td>${i.name}</td><td>${i.qty || ""} ${i.unit || ""}</td></tr>`).join("");
    win.document.write(`<html><head><title>Lista de súper</title><style>body{font-family:sans-serif;padding:24px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ddd;padding:8px}</style></head><body><h2>Lista de súper</h2><table><thead><tr><th></th><th>Producto</th><th>Cantidad</th></tr></thead><tbody>${rows}</tbody></table></body></html>`);
    win.document.close();
    win.print();
  }

  const thisMonth = new Date().toISOString().slice(0, 7);
  const monthExpenses = data.expenses.filter((e) => e.date.startsWith(thisMonth));
  const monthTotal = monthExpenses.reduce((s, e) => s + e.amount, 0);
  const budget = Number(data.profile.monthlyBudget || 0);
  const savings = budget ? budget - monthTotal : null;

  return (
    <div className="stack">
      <Card eyebrow="Lista de súper" title="Qué falta comprar" right={<button className="link" onClick={exportListPDF}>Exportar a PDF →</button>}>
        <div className="row">
          <input placeholder="Producto" value={item} onChange={(e) => setItem(e.target.value)} />
          <input placeholder="cant." value={qty} onChange={(e) => setQty(e.target.value)} style={{ maxWidth: 80 }} />
          <input placeholder="unidad" value={unit} onChange={(e) => setUnit(e.target.value)} style={{ maxWidth: 100 }} />
          <button className="btn" onClick={addItem}>Agregar</button>
        </div>
        <ul className="mini-list" style={{ marginTop: 12 }}>
          {data.shopping.map((i) => (
            <li key={i.id} className={i.checked ? "checked" : ""}>
              <label className="check-row">
                <input type="checkbox" checked={i.checked} onChange={() => toggleItem(i.id)} />
                <span>{i.name} {i.qty && `· ${i.qty} ${i.unit}`}</span>
              </label>
              <button className="icon-btn" onClick={() => removeItem(i.id)}>✕</button>
            </li>
          ))}
          {data.shopping.length === 0 && <p className="muted">Lista vacía — agrega lo que necesites cocinar esta semana.</p>}
        </ul>
      </Card>

      <Card eyebrow="Gastos" title="Registro del súper">
        <div className="row">
          <input type="date" value={expDate} onChange={(e) => setExpDate(e.target.value)} />
          <input type="number" placeholder="monto" value={expAmount} onChange={(e) => setExpAmount(e.target.value)} />
          <input placeholder="nota (opcional)" value={expNote} onChange={(e) => setExpNote(e.target.value)} />
          <button className="btn" onClick={addExpense}>Agregar</button>
        </div>

        <Field label="Presupuesto mensual (opcional)">
          <input
            type="number"
            placeholder="$"
            value={data.profile.monthlyBudget}
            onChange={(e) => update((d) => ({ ...d, profile: { ...d.profile, monthlyBudget: e.target.value } }))}
          />
        </Field>

        <div className="grid-2" style={{ marginTop: 12 }}>
          <div>
            <span className="muted">Gastado este mes</span>
            <p className="big-stat">${monthTotal.toFixed(0)}</p>
          </div>
          {savings != null && (
            <div>
              <span className="muted">{savings >= 0 ? "Puedes ahorrar" : "Te pasaste por"}</span>
              <p className={`big-stat ${savings >= 0 ? "down" : "up"}`}>${Math.abs(savings).toFixed(0)}</p>
            </div>
          )}
        </div>

        <ul className="mini-list" style={{ marginTop: 12 }}>
          {data.expenses.slice(-8).reverse().map((e) => (
            <li key={e.id}>
              <span>{e.date} — ${e.amount.toFixed(0)} {e.note && `(${e.note})`}</span>
              <button className="icon-btn" onClick={() => removeExpense(e.id)}>✕</button>
            </li>
          ))}
        </ul>
      </Card>
    </div>
  );
}
